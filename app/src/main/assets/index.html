<!doctype html><html lang="my"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#4b303e;--muted:#866375;--accent:#a34670;--line:#efd5e0}*{box-sizing:border-box}body{margin:0;background:#fff5f9;color:var(--ink);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:11px 17px;color:var(--ink)}button:active{transform:scale(.98)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.shell{display:flex;min-height:100vh}aside{width:220px;flex-shrink:0;border-right:1px solid var(--line);padding:26px 18px;background:#fbe3ee;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font:26px Georgia,serif;letter-spacing:2px;margin-bottom:5px}.tag{font-size:10px;letter-spacing:2px;color:var(--muted)}.section-label{font-size:10px;color:var(--muted);letter-spacing:2px;margin:35px 12px 12px}.nav{display:flex;flex-direction:column;gap:7px;overflow:auto}.nav button{border:0;background:transparent;text-align:left;display:flex;justify-content:space-between;gap:8px}.nav .active{background:white;color:var(--accent);box-shadow:0 4px 15px #8c3d640a}.foot{margin-top:auto;padding-top:20px;display:grid;gap:8px}.offline{font-size:11px;color:#7e8875;padding:8px}main{padding:28px 34px;flex:1;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:2px}h1{font:32px Georgia,serif;margin:10px 0}p{color:var(--muted);line-height:1.8}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0}.tools input{flex:1;min-width:140px}input,select,textarea{border:1px solid var(--line);border-radius:9px;background:white;padding:12px;color:var(--ink);width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer}.cover{height:200px;position:relative;display:flex;align-items:center;justify-content:center;background:#f8e4ed;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.sample{height:158px;width:118px;background:#fcfaf4;box-shadow:2px 6px 14px #58433729;border:1px solid #c8ad83;outline:1px solid #c8ad83;outline-offset:-7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;color:#94744c;font-family:Georgia,serif}.sample b{font-size:23px;font-weight:normal;margin:10px 0}.sample small{font-size:8px;letter-spacing:2px}.sample .flower{font-size:24px}.info{padding:16px}.info h3{font-size:15px;margin:0 0 10px;font-weight:500}.price{color:var(--accent);font-weight:600}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--muted)}.badge{position:absolute;left:10px;top:10px;background:#ffffffdf;padding:5px 9px;border-radius:6px;font-size:10px}.empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:15px;grid-column:1/-1}.overlay{position:fixed;inset:0;background:#432337aa;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}.modal{background:#fff5f9;border-radius:18px;max-height:94vh;overflow:auto;width:680px;padding:25px}.modal.wide{width:1000px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.modal h2{font-size:21px;margin:0}label{display:block;font-size:12px;margin:15px 0 7px}.row{display:flex;gap:14px}.row>*{flex:1;min-width:0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}.danger{color:#ab3434}.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:25px}.hero{height:55vh;min-height:200px;background:#f8e4ed;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden}.hero img,.hero video{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}.thumbs button{padding:5px;width:65px;height:60px;flex-shrink:0}.thumbs img{height:100%;width:100%;object-fit:cover}.large-price{font-size:28px;color:var(--accent);margin:20px 0 6px}.muted{color:var(--muted);font-size:12px}.manage-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#653a50;color:white;border-radius:10px;padding:15px 25px;z-index:20}.demo-note{font-size:11px;background:#fbe7f0;padding:10px 14px;border-radius:8px;color:#8c4b6b;margin-bottom:20px}@media(max-width:900px){aside{width:175px;padding:18px 12px}main{padding:20px}.brand{font-size:22px}.cover{height:175px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}h1{font-size:27px}.section-label{margin-top:24px}}@media(max-width:600px){aside{width:140px}.detail{grid-template-columns:1fr}.top{align-items:flex-start}.top button{padding:8px}main{padding:16px}.grid{grid-template-columns:1fr 1fr}.cover{height:145px}.sample{transform:scale(.8)}}
</style><link rel="stylesheet" href="layout.css"><body><div id="app"></div><div id="dialogs"></div><div id="notice"></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const seed={shop:'ဖိတ်စာ Gallery',categories:[{id:'wedding',name:'မင်္ဂလာဖိတ်စာ'},{id:'donation',name:'အလှူဖိတ်စာ'},{id:'special',name:'အထူးဒီဇိုင်း'}],items:[{id:'demo1',name:'Classic Ivory',category:'wedding',price:1200,unit:'တစ်စောင်',code:'WD-001',min:100,description:'နမူနာအဖြစ် ပြထားသော ဒီဇိုင်းနှင့် ဈေးနှုန်း ဖြစ်ပါသည်။ သင့်ဆိုင်၏ အချက်အလက်ဖြင့် ပြင်ဆင်ပါ။',media:[],demo:true,tone:'#e9dfd1'},{id:'demo2',name:'Rose Collection',category:'wedding',price:1800,unit:'တစ်စောင်',code:'WD-002',min:100,description:'နမူနာဈေးနှုန်း ဖြစ်ပါသည်။',media:[],demo:true,tone:'#eedbd6'},{id:'demo3',name:'ရွှေရောင် အလှူဖိတ်စာ',category:'donation',price:800,unit:'တစ်စောင်',code:'DN-001',min:100,description:'နမူနာဈေးနှုန်း ဖြစ်ပါသည်။',media:[],demo:true,tone:'#e5d9ba'}]};
let db;try{db=JSON.parse(Native.read()||'null')||seed}catch(e){db=seed}let category='all',query='',sort='new',admin=false,current=null,draft=null;
function save(){if(!Native.save(JSON.stringify(db))){toast('သိမ်းမရပါ။ Storage ကို စစ်ပါ။');return false}return true}
function toast(s){document.getElementById('notice').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>document.getElementById('notice').innerHTML='',3500)}
function sample(item){return `<div class="sample"><span class="flower">❦</span><small>THE INVITATION</small><b>${item.category==='donation'?'အလှူတော်':'With Love'}</b><small>YOU ARE INVITED</small></div>`}
const money=n=>Number(n).toLocaleString('en-US')+' ကျပ်';
function render(){let items=catalogItems().filter(i=>(category==='all'||i.category===category)&&[i.name,i.code,i.description,i.colors,i.size,i.paperType,i.priceNote].join(' ').toLowerCase().includes(query.toLowerCase()));if(sort==='new')items.sort((a,b)=>Number(b.featured)-Number(a.featured));if(sort==='low')items.sort((a,b)=>priceOrder(a,b,1));if(sort==='high')items.sort((a,b)=>priceOrder(a,b,-1));document.getElementById('app').innerHTML=`<div class="shell"><aside><div class="brand">PAPER & LOVE</div><div class="tag">INVITATION COLLECTION</div><div class="section-label">COLLECTIONS</div><nav class="nav">${[{id:'all',name:'အားလုံး'},...db.categories].map(c=>`<button class="${category===c.id?'active':''}" onclick="category='${c.id}';render()"><span>${esc(c.name)}</span><span>${catalogItems().filter(i=>c.id==='all'||i.category===c.id).length}</span></button>`).join('')}</nav><div class="foot"><span class="offline">● Offline အသုံးပြုနိုင်သည်</span><button onclick="openAdmin()">${admin?'⚙ Admin panel':'🔒 Admin ဝင်ရန်'}</button>${admin?'<button onclick="logoutAdmin()">Logout / Customer mode</button>':''}</div></aside><main><div class="top"><div><div class="eyebrow">A BEAUTIFUL BEGINNING</div><h1>${esc(db.shop)}</h1><span class="muted">သင့်အမှတ်တရနေ့အတွက် စိတ်ကြိုက်ဖိတ်စာ ရွေးချယ်ပါ</span></div>${admin?'<button class="primary" onclick="edit()">＋ နမူနာထည့်ရန်</button>':'<span class="muted">CATALOG · 01</span>'}</div><div class="tools"><input id="search" placeholder="ဖိတ်စာအမည် / ကုဒ် ရှာရန်…" value="${esc(query)}" oninput="search(this.value)"><select style="width:170px" onchange="sort=this.value;render()"><option value="new" ${sort==='new'?'selected':''}>မူလအစီအစဉ်</option><option value="low" ${sort==='low'?'selected':''}>ဈေးနည်း → များ</option><option value="high" ${sort==='high'?'selected':''}>ဈေးများ → နည်း</option></select><span class="muted">${items.length} နမူနာ</span></div>${catalogItems().some(i=>i.demo)?'<div class="demo-note">DEMO · ဒီဇိုင်းနှင့် ဈေးနှုန်းများသည် စမ်းသပ်နမူနာများ ဖြစ်ပါသည်။ စီမံရန်မှ သင့်ဆိုင်၏ နမူနာများ ထည့်နိုင်ပါသည်။</div>':''}<div class="grid">${items.map(i=>`<article class="card" onclick="detail('${i.id}')"><div class="cover" style="background:${esc(i.tone||'#f8e4ed')}">${i.media.length?(i.media[0].video?'<span style="font-size:45px">▷</span>':`<img src="${esc(i.media[0].src)}" loading="lazy">`):sample(i)}<span class="badge">${esc(i.code||'INVITATION')}${i.media.some(m=>m.video)?' · ▷ VIDEO':''}</span><div class="card-flags">${i.featured?'<span>★ လူကြိုက်များ</span>':''}${admin&&i.visible===false?'<span>မပြထားပါ</span>':''}</div></div><div class="info"><h3>${esc(displayName(i))}</h3><div class="meta"><span class="price">${esc(priceDisplay(i))}</span><span>${i.pricingMode==='quote'?'':'/ '+esc(i.unit)}</span></div></div></article>`).join('')||'<div class="empty">နမူနာ မတွေ့ပါ။<p>စီမံရန် မှ နမူနာအသစ် ထည့်နိုင်ပါသည်။</p></div>'}</div></main></div>`}
function search(q){let p=document.getElementById('search').selectionStart;query=q;render();let e=document.getElementById('search');e.focus();e.setSelectionRange(p,p)}
function modal(content,wide=false){document.getElementById('dialogs').innerHTML=`<div class="overlay"><div class="modal ${wide?'wide':''}">${content}</div></div>`}
function back(){if(document.getElementById('dialogs').innerHTML){document.getElementById('dialogs').innerHTML='';draft=null;current=null}else if(admin){logoutAdmin()}else{category='all';query='';render()}}
function mediaAdded(id,a){if(draft&&draft.id===id){draft.media.push(...a);drawEdit();toast(a.length+' ဖိုင် ထည့်ပြီးပါပြီ')}}
function confirmRestore(){modal('<h2>Backup ပြန်သွင်းမည်လား?</h2><p>လက်ရှိ catalog ကို အစားထိုးမည်။ လိုအပ်ပါက အရင် Backup ထုတ်ထားပါ။</p><div class="actions"><button onclick="settings()">မလုပ်တော့ပါ</button><button class="primary" onclick="Native.importData()">ZIP ဖိုင် ရွေးမည်</button></div>')}

</script><script src="designs.js"></script><script src="admin.js"></script><script src="admin-pages.js"></script><script src="updates.js"></script></body></html>
